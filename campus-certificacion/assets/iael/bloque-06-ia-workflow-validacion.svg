<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Flujo seguro de IA aplicada a proyectos eléctricos BIM">
  <defs>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#1e293b"/>
    </marker>
    <marker id="arr6g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="920" height="420" rx="14" fill="url(#grid6)"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="52" rx="14" fill="#0f172a"/>
  <rect x="0" y="38" width="920" height="14" fill="#0f172a"/>
  <text x="24" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#4ade80">BLOQUE 6 · IA RESPONSABLE EN INGENIERÍA ELÉCTRICA Y BIM (CHATGPT / CLAUDE)</text>
  <text x="24" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Ciclo de Trabajo con Control Profesional: Datos Seguros → Asistencia Estructurada → Contraste Independiente → Firma Humana</text>

  <!-- Stage 1 -->
  <rect x="22" y="74" width="200" height="226" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <circle cx="46" cy="96" r="13" fill="#2563eb"/>
  <text x="46" y="100" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">1</text>
  <text x="66" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#1e3a8a">ENTRADAS SEGURAS</text>
  <text x="36" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#0f172a">Prompt Estructurado:</text>
  <text x="36" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Rol y alcance técnico exacto</text>
  <text x="36" y="161" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• País y reglamento a revisar</text>
  <text x="36" y="177" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Tablas CSV Revit / DIALux</text>
  <text x="36" y="193" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Unidades SI obligatorias</text>
  <rect x="34" y="212" width="176" height="72" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="122" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#1d4ed8">🔒 Anonimización Previa</text>
  <text x="122" y="248" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Retirar nombres de cliente,</text>
  <text x="122" y="261" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">ubicaciones sensibles o planos</text>
  <text x="122" y="274" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">confidenciales sin permiso.</text>

  <line x1="222" y1="187" x2="246" y2="187" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr6)"/>

  <!-- Stage 2 -->
  <rect x="250" y="74" width="200" height="226" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <circle cx="274" cy="96" r="13" fill="#4f46e5"/>
  <text x="274" y="100" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">2</text>
  <text x="294" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#312e81">ASISTENTE LLM</text>
  <text x="264" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#0f172a">ChatGPT / Claude apoyan:</text>
  <text x="264" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Borradores de memorias</text>
  <text x="264" y="161" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Pliegos técnicos base</text>
  <text x="264" y="177" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Plantillas de fórmulas</text>
  <text x="264" y="193" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Checklists de auditoría BIM</text>
  <rect x="262" y="212" width="176" height="72" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
  <text x="350" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#9a3412">⚠️ Riesgos del Modelo</text>
  <text x="350" y="248" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#7c2d12">Puede alucinar artículos,</text>
  <text x="350" y="261" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#7c2d12">mezclar normas de otros países</text>
  <text x="350" y="274" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#7c2d12">o errar en aritmética textual.</text>

  <line x1="450" y1="187" x2="474" y2="187" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr6)"/>

  <!-- Stage 3 -->
  <rect x="478" y="74" width="206" height="226" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
  <circle cx="502" cy="96" r="13" fill="#ca8a04"/>
  <text x="502" y="100" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">3</text>
  <text x="522" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.2" font-weight="800" fill="#854d0e">CONTRASTE TÉCNICO</text>
  <text x="492" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#0f172a">Auditoría Independiente:</text>
  <text x="492" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">✓ Recalcular en hoja / software</text>
  <text x="492" y="161" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">✓ Validar tablas y factores (k)</text>
  <text x="492" y="177" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">✓ Cotejar texto vs. edición oficial</text>
  <text x="492" y="193" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">✓ Cruzar Revit ↔ Unifilar ↔ Lux</text>
  <rect x="490" y="212" width="182" height="72" rx="7" fill="#ffffff" stroke="#eab308" stroke-width="1.2"/>
  <text x="581" y="232" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#854d0e">Automatización Segura</text>
  <text x="581" y="248" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Probar scripts/Dynamo siempre</text>
  <text x="581" y="261" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">en copia de respaldo según</text>
  <text x="581" y="274" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">versión y permisos del estudio.</text>

  <line x1="684" y1="187" x2="708" y2="187" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr6g)"/>

  <!-- Stage 4 -->
  <rect x="712" y="74" width="186" height="226" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="736" cy="96" r="13" fill="#16a34a"/>
  <text x="736" y="100" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">4</text>
  <text x="756" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#14532d">DOSSIER + FIRMA</text>
  <text x="726" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="700" fill="#0f172a">Trazabilidad Final:</text>
  <text x="726" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Registro prompts y cambios</text>
  <text x="726" y="161" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Errores de IA detectados</text>
  <text x="726" y="177" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Coherencia modelo + PDF</text>
  <text x="726" y="193" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.6" fill="#334155">• Criterio humano final</text>
  <rect x="724" y="212" width="162" height="72" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
  <text x="805" y="234" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="800" fill="#14532d">✅ Responsabilidad</text>
  <text x="805" y="250" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#166534">La IA acelera redacción y</text>
  <text x="805" y="264" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#166534">revisión; NUNCA firma ni</text>
  <text x="805" y="278" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#166534">valida instalaciones reales.</text>

  <!-- Footer Safeguard Strip -->
  <rect x="20" y="320" width="880" height="82" rx="8" fill="#0f172a"/>
  <text x="460" y="344" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#fde047">PRINCIPIO RECTOR DEL PROGRAMA: «LA IA ASISTE Y DOCUMENTA · EL PROFESIONAL VERIFICA Y DECIDE»</text>
  <text x="460" y="365" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#e2e8f0">1. Cero datos confidenciales sin autorización · 2. Cero cálculos aritméticos de IA sin recalcular · 3. Cero citas normativas sin ir a la fuente</text>
  <text x="460" y="384" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#94a3b8">Todo trabajo destinado a obra o tramitación real requiere validación normativa por técnico competente en la jurisdicción correspondiente.</text>
</svg>
