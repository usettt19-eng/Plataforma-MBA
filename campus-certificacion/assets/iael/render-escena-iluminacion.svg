<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Comparativa visual de temperatura de color 3000K cálido frente a 4000K-4500K neutro en Twinmotion">
  <defs>
    <linearGradient id="warmGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.58"/>
      <stop offset="65%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e1b18" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="coolGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.62"/>
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="kelvinBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="920" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="50" rx="14" fill="#0b1124"/>
  <rect x="0" y="36" width="920" height="14" fill="#0b1124"/>
  <text x="24" y="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#fde047">MÓDULO 5 · ESCENA LUMÍNICA EN TWINMOTION: TEMPERATURA DE COLOR Y AMBIENTE</text>
  <text x="24" y="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#cbd5e1">Comparativa visual ilustrativa sobre un mismo espacio arquitectónico: Luz Cálida (3000 K) vs. Luz Neutra de Trabajo (4000 K – 4500 K)</text>

  <!-- LEFT HALF: 3000K Warm Scene -->
  <rect x="20" y="60" width="435" height="236" rx="10" fill="#231912" stroke="#b45309" stroke-width="1.6"/>
  <!-- Architectural interior left -->
  <rect x="20" y="60" width="435" height="28" rx="10" fill="#2f2218"/>
  <rect x="20" y="234" width="435" height="62" fill="#2b1f16"/>
  <!-- Recessed Warm Downlights + Linear Cove -->
  <ellipse cx="135" cy="88" rx="22" ry="5" fill="#fef08a"/>
  <ellipse cx="325" cy="88" rx="22" ry="5" fill="#fef08a"/>
  <polygon points="113,88 55,260 215,260 157,88" fill="url(#warmGlow)"/>
  <polygon points="303,88 245,260 405,260 347,88" fill="url(#warmGlow)"/>
  <!-- Pendant fixture over lounge/reception desk -->
  <line x1="230" y1="60" x2="230" y2="128" stroke="#92400e" stroke-width="2"/>
  <rect x="175" y="128" width="110" height="9" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="1.2"/>
  <polygon points="175,137 145,250 315,250 285,137" fill="url(#warmGlow)"/>
  <!-- Desk / sofa silhouette -->
  <rect x="135" y="218" width="190" height="18" rx="4" fill="#573b26"/>
  <rect x="155" y="236" width="14" height="32" fill="#3f2a1b"/>
  <rect x="291" y="236" width="14" height="32" fill="#3f2a1b"/>
  <!-- Soft floor reflection -->
  <ellipse cx="230" cy="272" rx="115" ry="12" fill="rgba(251,191,36,0.22)"/>

  <rect x="34" y="72" width="188" height="38" rx="7" fill="rgba(15,23,42,0.82)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="44" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#fde047">3000 K · BLANCO CÁLIDO</text>
  <text x="44" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#fef3c7">Recepción · Confort · Hostelería</text>

  <!-- RIGHT HALF: 4000K-4500K Neutral Office Scene -->
  <rect x="465" y="60" width="435" height="236" rx="10" fill="#111c2d" stroke="#0284c7" stroke-width="1.6"/>
  <!-- Architectural ceiling & workstations right -->
  <rect x="465" y="60" width="435" height="28" rx="10" fill="#18273e"/>
  <rect x="465" y="234" width="435" height="62" fill="#162235"/>
  <!-- Suspended Linear LED Office Luminaires -->
  <line x1="560" y1="60" x2="560" y2="122" stroke="#64748b" stroke-width="1.5"/>
  <line x1="630" y1="60" x2="630" y2="122" stroke="#64748b" stroke-width="1.5"/>
  <rect x="530" y="122" width="130" height="8" rx="3" fill="#ffffff" stroke="#38bdf8" stroke-width="1.4"/>
  <polygon points="532,130 492,256 698,256 658,130" fill="url(#coolGlow)"/>

  <line x1="740" y1="60" x2="740" y2="122" stroke="#64748b" stroke-width="1.5"/>
  <line x1="810" y1="60" x2="810" y2="122" stroke="#64748b" stroke-width="1.5"/>
  <rect x="710" y="122" width="130" height="8" rx="3" fill="#ffffff" stroke="#38bdf8" stroke-width="1.4"/>
  <polygon points="712,130 672,256 878,256 838,130" fill="url(#coolGlow)"/>

  <!-- Workstations + monitors -->
  <rect x="515" y="218" width="160" height="14" rx="3" fill="#334155"/>
  <rect x="575" y="196" width="38" height="22" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="705" y="218" width="160" height="14" rx="3" fill="#334155"/>
  <rect x="765" y="196" width="38" height="22" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <ellipse cx="685" cy="272" rx="145" ry="12" fill="rgba(125,211,252,0.20)"/>

  <rect x="676" y="72" width="210" height="38" rx="7" fill="rgba(15,23,42,0.82)" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="686" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#38bdf8">4000 K – 4500 K · NEUTRO</text>
  <text x="686" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#e0f2fe">Oficinas · Talleres · Claridad Visual</text>

  <!-- Kelvin Scale Strip -->
  <rect x="20" y="308" width="880" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
  <text x="36" y="328" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#f8fafc">Escala TCC (Kelvin):</text>
  <rect x="175" y="317" width="490" height="12" rx="6" fill="url(#kelvinBar)"/>
  <text x="175" y="343" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#fdba74">2700 K (Muy cálida)</text>
  <text x="355" y="343" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#fde047">3000 K</text>
  <text x="505" y="343" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#ffffff">4000 K</text>
  <text x="665" y="343" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#93c5fd">6500 K (Luz día fría)</text>
  <text x="688" y="334" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#cbd5e1">Mantener CRI / IRC ≥ 80–90 según uso</text>

  <!-- Footer critical warning -->
  <rect x="20" y="362" width="880" height="44" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="460" y="380" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#92400e">Recordatorio técnico: Twinmotion valida atmósfera, acabados, temperatura Kelvin y presentación espacial ante cliente;</text>
  <text x="460" y="396" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.3" fill="#78350f">NO sustituye los valores numéricos de Em (lux), uniformidad (U0) ni UGR calculados con fotometría certificada en DIALux.</text>
</svg>
