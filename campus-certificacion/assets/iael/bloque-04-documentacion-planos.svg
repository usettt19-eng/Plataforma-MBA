<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Anatomía de lámina técnica BIM y control documental PDF">
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="920" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="920" height="420" rx="14" fill="url(#grid4)"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="52" rx="14" fill="#0f172a"/>
  <rect x="0" y="38" width="920" height="14" fill="#0f172a"/>
  <text x="24" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#a5b4fc">BLOQUE 4 · DOCUMENTACIÓN BIM: PLANTILLAS DE VISTA, LÁMINAS Y ENTREGA PDF</text>
  <text x="24" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Anatomía de Lámina A1/A3: Separación por Sistema + Etiquetas Paramétricas + Cuadro de Cargas + Símbolos + Cartela</text>

  <!-- Sheet Outer Frame -->
  <rect x="24" y="66" width="872" height="288" rx="6" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
  <rect x="34" y="76" width="852" height="268" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- Zone 1: Main Plan View (Top-Left large area) -->
  <rect x="44" y="86" width="568" height="184" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="103" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#1e293b">1. PLANTA ELÉCTRICA · ESCALA 1:50 (Plantilla Vista: E-ALUMBRADO / E-TOMAS)</text>

  <!-- Architectural outline rooms inside Plan -->
  <rect x="64" y="114" width="240" height="136" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="304" y="114" width="286" height="136" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <!-- Door arcs / partition gap -->
  <line x1="304" y1="168" x2="304" y2="202" stroke="#ffffff" stroke-width="4"/>

  <!-- Lighting circuit + tags (Indigo) -->
  <rect x="115" y="140" width="24" height="12" fill="#4f46e5"/>
  <rect x="225" y="140" width="24" height="12" fill="#4f46e5"/>
  <path d="M 139 146 L 225 146" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 3"/>
  <line x1="127" y1="140" x2="100" y2="128" stroke="#4f46e5" stroke-width="1"/>
  <rect x="72" y="118" width="58" height="15" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1"/>
  <text x="101" y="129" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#312e81">L1 · C1-A</text>

  <!-- Power outlets + dimension line (Cyan) -->
  <circle cx="348" cy="236" r="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="485" cy="236" r="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <path d="M 354 236 L 479 236" fill="none" stroke="#0891b2" stroke-width="2"/>
  <rect x="492" y="198" width="76" height="16" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1"/>
  <text x="530" y="209" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#155e75">h=+0,30 m · C2</text>

  <!-- Filter badge -->
  <rect x="330" y="124" width="244" height="44" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="342" y="141" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#92400e">Filtros por Regla Activos:</text>
  <text x="342" y="156" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#78350f">• Emergencia = Rojo | Normal = Azul/Gris</text>

  <!-- Bottom-Left: Detail Callout & Revision -->
  <rect x="44" y="278" width="276" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="56" y="295" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#1e293b">2. LLAMADAS DE DETALLE (1:20)</text>
  <text x="56" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Sección de cuarto eléctrico · Zanja / PAT</text>
  <text x="56" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Montaje de soportes y paso cortafuegos</text>

  <rect x="328" y="278" width="284" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="340" y="295" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#1e293b">3. ESPECIFICACIONES Y NOTAS BIM</text>
  <text x="340" y="311" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Notas clave enlazadas a parámetros reales</text>
  <text x="340" y="325" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#475569">Exportación PDF vectorial + escalado 100 %</text>

  <!-- Right Column of Sheet -->
  <!-- Panel Schedule -->
  <rect x="622" y="86" width="254" height="90" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="622" y="86" width="254" height="22" fill="#e2e8f0"/>
  <text x="749" y="101" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" font-weight="800" fill="#0f172a">4. TABLA / CUADRO DE CARGAS</text>
  <line x1="622" y1="128" x2="876" y2="128" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="622" y1="148" x2="876" y2="148" stroke="#cbd5e1" stroke-width="1"/>
  <text x="632" y="121" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#334155">C1 · Alumbrado | 1,8 kW | 2×1,5+PE | 10 A</text>
  <text x="632" y="141" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#334155">C2 · Tomas Gral | 3,4 kW | 2×2,5+PE | 16 A</text>
  <text x="632" y="164" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#0369a1">Coherente con unifilar y memoria de cálculo</text>

  <!-- Legend -->
  <rect x="622" y="184" width="254" height="72" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="632" y="201" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" font-weight="800" fill="#0f172a">5. LEYENDA DE SIMBOLOGÍA</text>
  <rect x="634" y="212" width="16" height="8" fill="#4f46e5"/>
  <text x="658" y="220" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Luminaria LED (con filtro sistema)</text>
  <circle cx="642" cy="236" r="5" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="658" y="240" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#334155">Toma corriente (anotación +2P+T)</text>

  <!-- Title Block / Cartela -->
  <rect x="622" y="264" width="254" height="72" rx="4" fill="#0f172a"/>
  <text x="634" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="800" fill="#fde047">6. CARTELA / CAJETÍN BIM</text>
  <text x="634" y="298" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#e2e8f0">Código Plano: E-201 | Escala: 1:50</text>
  <text x="634" y="313" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#cbd5e1">Estado: Revisado · Impresión PDF 1:1</text>
  <text x="634" y="328" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#94a3b8">Revisor responsable / Fecha / Rev. 02</text>

  <!-- Footer disclaimer -->
  <rect x="20" y="366" width="880" height="38" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="460" y="383" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#312e81">Regla documental: cada etiqueta, tabla y leyenda debe nacer de parámetros vivos del modelo BIM (cero textos muertos)</text>
  <text x="460" y="397" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#4338ca">y contrastarse con el diagrama unifilar, pliego técnico y reglamento aplicable antes de emitir el PDF final.</text>
</svg>
