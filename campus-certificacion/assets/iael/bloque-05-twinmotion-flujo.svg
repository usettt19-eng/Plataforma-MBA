<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Flujo interoperable realista DIALux, Revit MEP y Twinmotion">
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arr5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#0e7490"/>
    </marker>
    <marker id="arr5b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="920" height="420" rx="14" fill="url(#grid5)"/>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="52" rx="14" fill="#0f172a"/>
  <rect x="0" y="38" width="920" height="14" fill="#0f172a"/>
  <text x="24" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#fbbf24">BLOQUE 5 · INTEROPERABILIDAD REALISTA: DIALUX + REVIT MEP → TWINMOTION</text>
  <text x="24" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">Límites de intercambio de datos, Direct Link Datasmith, Materiales PBR, Iluminación Escénica y Entregables 360°</text>

  <!-- Source 1: Revit MEP (Top Left) -->
  <rect x="26" y="72" width="250" height="114" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="42" y="95" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">1A. REVIT MEP (BIM 3D)</text>
  <text x="42" y="114" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#334155">• Geometría 3D: tableros, tubos y bandejas</text>
  <text x="42" y="131" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#334155">• Anfitriones y posición exacta de luminarias</text>
  <text x="42" y="148" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#334155">• Vista 3D limpia para exportación fluida</text>
  <rect x="42" y="158" width="218" height="20" rx="4" fill="#dbeafe"/>
  <text x="151" y="172" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#1e40af">Datasmith Direct Link (sincronizable)</text>

  <!-- Source 2: DIALux (Bottom Left) -->
  <rect x="26" y="202" width="250" height="122" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="42" y="225" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#92400e">1B. DIALUX (CÁLCULO LUMÍNICO)</text>
  <text x="42" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#334155">• Ficheros fotométricos .LDT / .IES reales</text>
  <text x="42" y="261" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#334155">• Coordenadas y selección técnica validada</text>
  <text x="42" y="278" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" fill="#9a3412">⚠️ Sin vínculo mágico directo de cálculos:</text>
  <text x="42" y="294" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#78350f">Se transfiere geometría (IFC/DWG) o .IES</text>
  <text x="42" y="309" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#78350f">aplicado manualmente en luces de escena</text>

  <!-- Arrows to Center Hub -->
  <line x1="276" y1="129" x2="344" y2="175" stroke="#0e7490" stroke-width="2.6" marker-end="url(#arr5)"/>
  <line x1="276" y1="262" x2="344" y2="215" stroke="#b45309" stroke-width="2.6" stroke-dasharray="5 3" marker-end="url(#arr5b)"/>

  <!-- Center: Twinmotion Scene Engine -->
  <rect x="350" y="72" width="286" height="252" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2.2"/>
  <text x="493" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#155e75">2. ESCENA EN TWINMOTION</text>
  <text x="493" y="112" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#0e7490">Comunicación visual arquitectónica y MEP</text>

  <rect x="368" y="124" width="250" height="44" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.3"/>
  <text x="380" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="800" fill="#0f172a">🎨 Materiales PBR MEP</text>
  <text x="380" y="157" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" fill="#475569">Galvanizado, cobre, PVC y emisores LED</text>

  <rect x="368" y="176" width="250" height="44" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.3"/>
  <text x="380" y="194" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="800" fill="#0f172a">💡 Luces, Color y Temperatura (K)</text>
  <text x="380" y="209" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" fill="#475569">3000K cálido vs. 4000K neutro · Perfiles IES</text>

  <rect x="368" y="228" width="250" height="44" rx="7" fill="#ffffff" stroke="#06b6d4" stroke-width="1.3"/>
  <text x="380" y="246" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="800" fill="#0f172a">🏙️ Ambientación y Fases</text>
  <text x="380" y="261" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" fill="#475569">Escenarios día/noche · Falso techo ocultable</text>

  <rect x="368" y="280" width="250" height="32" rx="6" fill="#0f172a"/>
  <text x="493" y="300" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#fde047">Lumen / Path Tracer · Control Exposición</text>

  <!-- Arrow to Outputs -->
  <line x1="636" y1="198" x2="674" y2="198" stroke="#0e7490" stroke-width="2.8" marker-end="url(#arr5)"/>

  <!-- Right Panel: Deliverables -->
  <rect x="680" y="72" width="218" height="252" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="789" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#1e293b">3. ENTREGABLES</text>

  <rect x="696" y="112" width="186" height="46" rx="7" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="789" y="131" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#312e81">🖼️ Imágenes 4K</text>
  <text x="789" y="146" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.2" fill="#475569">Encuadres cuartos e interiores</text>

  <rect x="696" y="166" width="186" height="46" rx="7" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <text x="789" y="185" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#0369a1">🎬 Recorrido Vídeo MP4</text>
  <text x="789" y="200" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.2" fill="#475569">Secuencia plénum + encendido</text>

  <rect x="696" y="220" width="186" height="46" rx="7" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="789" y="239" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#115e59">🌐 Panoramas 360°</text>
  <text x="789" y="254" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.2" fill="#475569">Presentaciones interactivas</text>

  <rect x="696" y="274" width="186" height="38" rx="6" fill="#eef2ff"/>
  <text x="789" y="290" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#3730a3">Acompaña siempre a</text>
  <text x="789" y="303" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#3730a3">planos PDF y memorias</text>

  <!-- Footer critical boundary -->
  <rect x="20" y="340" width="880" height="64" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="460" y="361" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">FRONTERA CRÍTICA: COMUNICACIÓN VISUAL (TWINMOTION) ≠ COMPROBACIÓN LUMÍNICA (DIALUX) ≠ CUMPLIMIENTO ELÉCTRICO</text>
  <text x="460" y="378" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.3" fill="#7f1d1d">La exposición automática de cámara o el posprocesado artístico pueden hacer que un espacio parezca muy iluminado aunque no alcance los lux requeridos.</text>
  <text x="460" y="393" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.3" fill="#7f1d1d">La validación fotométrica cuantitativa se realiza en DIALux y el cumplimiento eléctrico se justifica en memoria, unifilar y cálculo normativo.</text>
</svg>
