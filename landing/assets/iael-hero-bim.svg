<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Visualización BIM 3D de instalaciones eléctricas, iluminación e IA">
  <defs>
    <linearGradient id="bgHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1124"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0e4f66"/>
    </linearGradient>
    <linearGradient id="beamWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="isoGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(56,189,248,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="460" rx="16" fill="url(#bgHero)"/>
  <rect width="800" height="460" rx="16" fill="url(#isoGrid)"/>
  <rect x="14" y="14" width="772" height="432" rx="12" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Architectural Isometric Floor Slab -->
  <polygon points="110,335 450,415 745,305 405,230" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <polygon points="110,335 450,415 450,428 110,348" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <polygon points="450,415 745,305 745,318 450,428" fill="#0b1124" stroke="#334155" stroke-width="1"/>

  <!-- Back Architectural Walls -->
  <polygon points="110,335 110,120 405,40 405,230" fill="#162038" stroke="#334155" stroke-width="1.5"/>
  <polygon points="405,230 405,40 745,112 745,305" fill="#1b2845" stroke="#334155" stroke-width="1.5"/>

  <!-- Architectural Ceiling Structural Slab / Cutaway -->
  <polygon points="110,120 405,40 745,112 450,185" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- Interior Glass Partition -->
  <polygon points="335,280 515,322 515,190 335,148" fill="rgba(56,189,248,0.08)" stroke="rgba(125,211,252,0.45)" stroke-width="1.5"/>

  <!-- Switchgear Cabinet (Left Wall) -->
  <polygon points="145,315 145,180 212,162 212,297" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="160" y="198" width="38" height="22" rx="3" transform="skewY(-14)" fill="#1e293b" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="195" cy="245" r="3.5" fill="#22c55e"/>
  <circle cx="195" cy="256" r="3.5" fill="#fbbf24"/>
  <text x="178" y="330" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fde047">TABLERO MDP</text>

  <!-- BIM 3D Conduit & Cable Tray Network (Glowing Cyan & Amber) -->
  <g filter="url(#glowCyan)">
    <!-- Vertical riser conduit from panel -->
    <path d="M 178 171 L 178 112 L 405 58 L 620 108" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Branch tray across right room -->
    <path d="M 405 58 L 405 145 L 580 185" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vertical drop to power outlets -->
    <path d="M 580 185 L 580 315" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 655 116 L 655 280" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Junction Boxes / Condulets -->
  <circle cx="178" cy="112" r="6" fill="#0f172a" stroke="#fde047" stroke-width="2.2"/>
  <circle cx="405" cy="58" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2"/>
  <circle cx="405" cy="145" r="5" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
  <rect x="572" y="308" width="16" height="16" rx="3" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>

  <!-- Suspended Linear LED Architectural Luminaires + Light Cones -->
  <g>
    <!-- Luminaire 1 -->
    <polygon points="275,152 385,176 410,338 245,296" fill="url(#beamWarm)"/>
    <polygon points="268,148 392,175 392,183 268,156" fill="#fef08a" stroke="#ffffff" stroke-width="1"/>
    <!-- Luminaire 2 -->
    <polygon points="465,124 590,152 618,312 438,270" fill="url(#beamCyan)"/>
    <polygon points="458,120 598,151 598,159 458,128" fill="#e0f2fe" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Photometric Polar Curves Inset Card (Top Right) -->
  <g transform="translate(572, 26)">
    <rect width="202" height="118" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(56,189,248,0.45)" stroke-width="1.5"/>
    <text x="14" y="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#38bdf8">FOTOMETRÍA DIALUX · BIM</text>
    <circle cx="52" cy="64" r="24" fill="none" stroke="rgba(148,163,184,0.35)" stroke-width="1"/>
    <circle cx="52" cy="64" r="14" fill="none" stroke="rgba(148,163,184,0.35)" stroke-width="1"/>
    <path d="M 52 54 C 72 60, 74 82, 52 94 C 30 82, 32 60, 52 54 Z" fill="rgba(56,189,248,0.28)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="90" y="52" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#e2e8f0">Em: 520 lux</text>
    <text x="90" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#e2e8f0">U0: 0,68 · UGR 18</text>
    <text x="90" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#fde047">ΔV: 1,42 % OK</text>
    <text x="90" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.2" fill="#94a3b8">.LDT / .IES + Revit MEP</text>
  </g>

  <!-- AI Copilot Badge Overlay (Bottom Left) -->
  <g transform="translate(26, 26)">
    <rect width="224" height="72" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(251,191,36,0.45)" stroke-width="1.5"/>
    <text x="14" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#fde047">ASISTENCIA IA TRAZABLE</text>
    <text x="14" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#e2e8f0">ChatGPT + Claude · Prompts técnicos</text>
    <text x="14" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#4ade80">✓ Revisión normativa por ingeniero</text>
  </g>

  <!-- Bottom Clean Tool Strip -->
  <rect x="24" y="400" width="752" height="36" rx="8" fill="rgba(11,17,36,0.9)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="400" y="422" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">Diseño Eléctrico + DIALux (.ldt / .ies) + Revit MEP 3D + Twinmotion (Direct Link) + IA Validada</text>
</svg>
